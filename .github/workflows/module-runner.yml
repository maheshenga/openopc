name: Module Runner

on:
  pull_request:
    paths:
      - 'apps/module-runner/**'
      - 'packages/module-runtime-contracts/**'
      - '.github/workflows/module-runner.yml'
  push:
    branches: [main]
    paths:
      - 'apps/module-runner/**'
      - 'packages/module-runtime-contracts/**'
      - '.github/workflows/module-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-gate:
    name: Rust and TypeScript protocol gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Check Rust format
        run: cargo +1.97.1 fmt --manifest-path apps/module-runner/Cargo.toml -- --check

      - name: Lint Rust targets
        run: cargo +1.97.1 clippy --locked --manifest-path apps/module-runner/Cargo.toml --all-targets -- -D warnings

      - name: Test cross-language Runner contracts
        run: cargo +1.97.1 test --locked --manifest-path apps/module-runner/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install shared contract dependencies
        run: |
          corepack enable pnpm
          corepack prepare pnpm@8.11.0 --activate
          pnpm install --frozen-lockfile --filter '@openopc/module-runtime-contracts...'
        env:
          npm_config_engine_strict: 'false'

      - name: Test TypeScript contract source
        run: pnpm --filter '@openopc/module-runtime-contracts' test

      - name: Build the non-root Runner image
        run: docker build --file apps/module-runner/Dockerfile --tag openopc-module-runner:ci .
