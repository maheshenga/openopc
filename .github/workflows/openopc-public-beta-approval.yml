name: OpenOPC Public Beta Approval

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Immutable staging workflow run that produced the candidate bundle"
        required: true
        type: string
      expected_commit:
        description: "Full 40-character commit recorded by the staging bundle"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  CANDIDATE_DIR: _public-beta-candidate
  APPROVAL_CONTROL_REF: ${{ github.ref }}
  APPROVAL_CONTROL_SHA: ${{ github.workflow_sha }}

jobs:
  validate:
    name: Verify immutable public-beta candidate
    if: ${{ github.ref == 'refs/heads/main' && github.sha == github.workflow_sha }}
    runs-on: windows-latest
    outputs:
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      candidate_artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
      candidate_run_attempt: ${{ steps.candidate.outputs.run_attempt }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Authenticate the canonical staging candidate
        id: candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          APPROVAL_CONTROL_REF: ${{ github.ref }}
          APPROVAL_CONTROL_SHA: ${{ github.workflow_sha }}
          APPROVAL_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const candidateRunId = Number(process.env.CANDIDATE_RUN_ID);
            const expectedCommit = process.env.EXPECTED_COMMIT;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/openopc-public-beta-gates.yml';
            const artifactName = 'openopc-public-beta-staging-bundle';
            const approvalControlRef = process.env.APPROVAL_CONTROL_REF;
            const approvalControlSha = process.env.APPROVAL_CONTROL_SHA;
            const approvalWorkflowRef = process.env.APPROVAL_WORKFLOW_REF;
            const expectedApprovalWorkflowRef = `${expectedRepository}/.github/workflows/openopc-public-beta-approval.yml@refs/heads/main`;
            if (
              approvalControlRef !== 'refs/heads/main' ||
              !/^[0-9a-f]{40}$/.test(approvalControlSha ?? '') ||
              approvalControlSha !== context.sha ||
              approvalWorkflowRef !== expectedApprovalWorkflowRef
            ) {
              throw new Error('PUBLIC_BETA_APPROVAL_CONTROL_UNTRUSTED');
            }
            if (!Number.isSafeInteger(candidateRunId) || candidateRunId < 1) {
              throw new Error('PUBLIC_BETA_CANDIDATE_RUN_ID_INVALID');
            }
            if (!/^[0-9a-f]{40}$/.test(expectedCommit ?? '')) {
              throw new Error('PUBLIC_BETA_EXPECTED_COMMIT_INVALID');
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: candidateRunId,
            });
            if (
              run.repository?.full_name?.toLowerCase() !== expectedRepository.toLowerCase() ||
              run.path !== expectedWorkflowPath ||
              run.name !== 'OpenOPC Public Beta Gates' ||
              run.event !== 'workflow_dispatch' ||
              run.head_branch !== 'staging' ||
              run.head_sha !== expectedCommit ||
              run.status !== 'completed' ||
              run.conclusion !== 'success' ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt < 1
            ) {
              throw new Error('PUBLIC_BETA_CANDIDATE_RUN_UNTRUSTED');
            }

            const allArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: candidateRunId,
                per_page: 100,
              },
            );
            const artifacts = allArtifacts.filter(
              (artifact) =>
                artifact.name === artifactName &&
                !artifact.expired &&
                Date.parse(artifact.expires_at) > Date.now(),
            );
            if (artifacts.length !== 1) {
              throw new Error('PUBLIC_BETA_CANDIDATE_ARTIFACT_AMBIGUOUS');
            }
            const [artifact] = artifacts;
            if (
              !Number.isSafeInteger(artifact.size_in_bytes) ||
              artifact.size_in_bytes < 1 ||
              artifact.workflow_run?.id !== run.id ||
              artifact.workflow_run?.head_sha !== expectedCommit ||
              artifact.workflow_run?.repository_id !== run.repository?.id ||
              !/^sha256:[0-9a-f]{64}$/.test(artifact.digest ?? '')
            ) {
              throw new Error('PUBLIC_BETA_CANDIDATE_ARTIFACT_DIGEST_INVALID');
            }

            core.setOutput('artifact_id', String(artifact.id));
            core.setOutput('artifact_digest', artifact.digest);
            core.setOutput('run_attempt', String(run.run_attempt));

      - name: Provision the pinned Bun runtime
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.14'

      - name: Checkout the trusted approval control source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - name: Download immutable staging bundle by run id
        id: download-candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          merge-multiple: true
          path: _public-beta-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify commit and candidate artifact digests
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'PUBLIC_BETA_EXPECTED_COMMIT_INVALID'
          }
          if ($env:CANDIDATE_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') {
            throw 'PUBLIC_BETA_CANDIDATE_RUN_ID_INVALID'
          }
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -cne $env:APPROVAL_CONTROL_SHA) {
            throw "PUBLIC_BETA_APPROVAL_CONTROL_MISMATCH:$actualCommit"
          }

          $bundleRoot = [IO.Path]::GetFullPath((Join-Path (Get-Location).Path $env:CANDIDATE_DIR))
          $bundleDirectory = Get-Item -LiteralPath $bundleRoot -Force -ErrorAction Stop
          if (-not $bundleDirectory.PSIsContainer -or ($bundleDirectory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
          }
          function Get-SafeBundleFile([string]$relativePath) {
            if ([string]::IsNullOrWhiteSpace($relativePath) -or
                $relativePath -match '[\\\x00-\x1f\x7f]' -or
                $relativePath -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,254}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,254})*$') {
              throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
            }
            $candidate = [IO.Path]::GetFullPath((Join-Path $bundleRoot ($relativePath -replace '/', '\')))
            $rootPrefix = $bundleRoot.TrimEnd('\') + '\'
            if (-not $candidate.StartsWith($rootPrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
            }
            $cursor = $bundleRoot
            foreach ($part in ($relativePath -split '/')) {
              $cursor = Join-Path $cursor $part
              $item = Get-Item -LiteralPath $cursor -Force -ErrorAction Stop
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
              }
            }
            $file = Get-Item -LiteralPath $candidate -Force -ErrorAction Stop
            if (-not $file.PSIsContainer -and $file.FullName.StartsWith($rootPrefix, [StringComparison]::OrdinalIgnoreCase)) {
              return $candidate
            }
            throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
          }

          $manifestRelativePath = 'release-candidate.json'
          $manifestPath = Get-SafeBundleFile $manifestRelativePath
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ([string]$manifest.commit -cne $env:EXPECTED_COMMIT) {
            throw 'PUBLIC_BETA_MANIFEST_COMMIT_MISMATCH'
          }
          if ($null -ne $manifest.approval) {
            throw 'PUBLIC_BETA_APPROVAL_MUST_START_NULL'
          }
          $evidencePath = Get-SafeBundleFile ([string]$manifest.evidencePath)
          $artifactManifestPath = Get-SafeBundleFile ([string]$manifest.artifactManifestPath)
          $artifactManifestDigest = (Get-FileHash -LiteralPath $artifactManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (('sha256:' + $artifactManifestDigest) -cne [string]$manifest.artifactManifestDigest) {
            throw 'PUBLIC_BETA_ARTIFACT_MANIFEST_DIGEST_MISMATCH'
          }
          $remotePattern = '^(https|oci)://[A-Za-z0-9.-]+(?::[0-9]{1,5})?/[A-Za-z0-9][A-Za-z0-9._-]{0,254}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,254})*@sha256:([0-9a-f]{64})$'
          foreach ($artifact in @($manifest.artifacts)) {
            $candidatePath = [string]$artifact.imageOrPath
            $remote = [regex]::Match($candidatePath, $remotePattern)
            if ($remote.Success) {
              if (('sha256:' + $remote.Groups[2].Value) -cne [string]$artifact.digest) {
                throw "PUBLIC_BETA_ARTIFACT_DIGEST_MISMATCH:$($artifact.name)"
              }
              continue
            }
            $path = Get-SafeBundleFile $candidatePath
            $actualDigest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if (('sha256:' + $actualDigest) -cne [string]$artifact.digest) {
              throw "PUBLIC_BETA_ARTIFACT_DIGEST_MISMATCH:$($artifact.name)"
            }
          }

      - name: Verify the pre-approval candidate is not ready
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          if (-not (Get-Command bun -ErrorAction SilentlyContinue)) {
            throw 'PUBLIC_BETA_BUN_RUNTIME_MISSING'
          }
          $bundleRoot = [IO.Path]::GetFullPath((Join-Path (Get-Location).Path $env:CANDIDATE_DIR))
          $env:OPENOPC_PUBLIC_BETA_BUNDLE_ROOT = $bundleRoot
          $manifestRelativePath = 'release-candidate.json'
          $manifestPath = Join-Path $bundleRoot $manifestRelativePath
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $evidenceRelativePath = [string]$manifest.evidencePath
          if ($evidenceRelativePath -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,254}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,254})*$') {
            throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
          }
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $stderrPath = Join-Path $env:RUNNER_TEMP 'openopc-public-beta-preapproval.stderr'
          Remove-Item -LiteralPath $stderrPath -Force -ErrorAction SilentlyContinue
          $output = @(pnpm.cmd exec bun scripts/release/public-beta-release-manifest.ts --manifest $manifestRelativePath --evidence $evidenceRelativePath --now $now 2> $stderrPath)
          $validatorExit = $LASTEXITCODE
          if ($validatorExit -ne 2) { throw "PUBLIC_BETA_PRE_APPROVAL_VALIDATOR_EXIT:$validatorExit" }
          if ($output.Count -ne 1) { throw 'PUBLIC_BETA_VALIDATOR_STDOUT_INVALID' }
          $stderrLines = @(
            if (Test-Path -LiteralPath $stderrPath) {
              Get-Content -LiteralPath $stderrPath | Where-Object { $_.Length -gt 0 }
            }
          )
          if ($stderrLines.Count -ne 1 -or $stderrLines[0] -cne 'PUBLIC_BETA_HUMAN_APPROVAL_REQUIRED') {
            throw 'PUBLIC_BETA_VALIDATOR_STDERR_INVALID'
          }
          $result = ([string]$output[0]) | ConvertFrom-Json
          $reasons = @($result.reasons | ForEach-Object { [string]$_ })
          if ($result.status -ne 'not_ready' -or $reasons.Count -ne 1 -or $reasons[0] -cne 'PUBLIC_BETA_HUMAN_APPROVAL_REQUIRED') {
            throw 'PUBLIC_BETA_PRE_APPROVAL_REASONS_INVALID'
          }

  approve:
    name: Human production approval and attestation
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && github.sha == github.workflow_sha }}
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve the protected-environment reviewer
        id: environment-review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          APPROVAL_RUN_ID: ${{ github.run_id }}
          APPROVAL_RUN_ATTEMPT: ${{ github.run_attempt }}
          DISPATCHER: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const approvalRunId = Number(process.env.APPROVAL_RUN_ID);
            const approvalRunAttempt = Number(process.env.APPROVAL_RUN_ATTEMPT);
            const dispatcher = process.env.DISPATCHER ?? '';
            const dispatchers = new Set(
              [dispatcher, process.env.TRIGGERING_ACTOR ?? '']
                .filter((actor) => actor.length > 0)
                .map((actor) => actor.toLowerCase()),
            );
            if (
              !Number.isSafeInteger(approvalRunId) ||
              approvalRunId < 1 ||
              approvalRunAttempt !== 1 ||
              dispatcher.length < 1
            ) {
              throw new Error('PUBLIC_BETA_PRODUCTION_APPROVAL_INVALID');
            }
            const { data: reviews } = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: approvalRunId,
              },
            );
            const approvedReviews = reviews.filter(
              (review) =>
                String(review.state).toLowerCase() === 'approved' &&
                review.user?.type === 'User' &&
                review.environments?.some(
                  (environment) => environment.name?.toLowerCase() === 'production',
                ),
            );
            const reviewers = [
              ...new Set(
                approvedReviews
                  .map((review) => review.user?.login)
                  .filter((login) => typeof login === 'string' && login.length > 0),
              ),
            ];
            if (reviewers.length < 1) {
              throw new Error('PUBLIC_BETA_PRODUCTION_APPROVAL_MISSING');
            }
            if (reviewers.length !== 1) {
              throw new Error('PUBLIC_BETA_PRODUCTION_APPROVER_AMBIGUOUS');
            }
            const [reviewer] = reviewers;
            if (dispatchers.has(reviewer.toLowerCase())) {
              throw new Error('PUBLIC_BETA_SELF_REVIEW_FORBIDDEN');
            }
            core.setOutput('reviewer', reviewer);

      - name: Provision the pinned Bun runtime
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.14'

      - name: Reauthenticate the immutable staging candidate
        id: candidate-recheck
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_ARTIFACT_ID: ${{ needs.validate.outputs.candidate_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.validate.outputs.candidate_artifact_digest }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.validate.outputs.candidate_run_attempt }}
        with:
          script: |
            const candidateRunId = Number(process.env.CANDIDATE_RUN_ID);
            const expectedArtifactId = process.env.EXPECTED_ARTIFACT_ID;
            const expectedArtifactDigest = process.env.EXPECTED_ARTIFACT_DIGEST;
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
            const expectedCommit = process.env.EXPECTED_COMMIT;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/openopc-public-beta-gates.yml';
            const artifactName = 'openopc-public-beta-staging-bundle';
            if (
              !Number.isSafeInteger(candidateRunId) ||
              candidateRunId < 1 ||
              !Number.isSafeInteger(expectedRunAttempt) ||
              expectedRunAttempt < 1 ||
              !/^[1-9][0-9]*$/.test(expectedArtifactId ?? '') ||
              !/^sha256:[0-9a-f]{64}$/.test(expectedArtifactDigest ?? '')
            ) {
              throw new Error('PUBLIC_BETA_CANDIDATE_IDENTITY_CHANGED');
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: candidateRunId,
            });
            if (
              run.repository?.full_name?.toLowerCase() !== expectedRepository.toLowerCase() ||
              run.path !== expectedWorkflowPath ||
              run.name !== 'OpenOPC Public Beta Gates' ||
              run.event !== 'workflow_dispatch' ||
              run.head_branch !== 'staging' ||
              run.head_sha !== expectedCommit ||
              run.status !== 'completed' ||
              run.conclusion !== 'success' ||
              run.run_attempt !== expectedRunAttempt
            ) {
              throw new Error('PUBLIC_BETA_CANDIDATE_IDENTITY_CHANGED');
            }

            const allArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: candidateRunId,
                per_page: 100,
              },
            );
            const artifacts = allArtifacts.filter(
              (artifact) =>
                artifact.name === artifactName &&
                !artifact.expired &&
                Date.parse(artifact.expires_at) > Date.now(),
            );
            if (artifacts.length !== 1) {
              throw new Error('PUBLIC_BETA_CANDIDATE_IDENTITY_CHANGED');
            }
            const [artifact] = artifacts;
            if (
              !Number.isSafeInteger(artifact.size_in_bytes) ||
              artifact.size_in_bytes < 1 ||
              artifact.workflow_run?.id !== run.id ||
              artifact.workflow_run?.head_sha !== expectedCommit ||
              artifact.workflow_run?.repository_id !== run.repository?.id ||
              String(artifact.id) !== expectedArtifactId ||
              artifact.digest !== expectedArtifactDigest
            ) {
              throw new Error('PUBLIC_BETA_CANDIDATE_IDENTITY_CHANGED');
            }

      - name: Checkout the trusted approval control source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - name: Download the same immutable staging bundle
        id: download-candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.validate.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: _public-beta-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Recheck bundle containment and digests before attestation
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $actualCommit -cne $env:APPROVAL_CONTROL_SHA) {
            throw 'PUBLIC_BETA_APPROVAL_CONTROL_MISMATCH'
          }
          $bundleRoot = [IO.Path]::GetFullPath((Join-Path (Get-Location).Path $env:CANDIDATE_DIR))
          $bundleDirectory = Get-Item -LiteralPath $bundleRoot -Force -ErrorAction Stop
          if (-not $bundleDirectory.PSIsContainer -or ($bundleDirectory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
          }
          function Get-SafeBundleFile([string]$relativePath) {
            if ([string]::IsNullOrWhiteSpace($relativePath) -or
                $relativePath -match '[\\\x00-\x1f\x7f]' -or
                $relativePath -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,254}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,254})*$') {
              throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
            }
            $candidate = [IO.Path]::GetFullPath((Join-Path $bundleRoot ($relativePath -replace '/', '\')))
            $rootPrefix = $bundleRoot.TrimEnd('\') + '\'
            if (-not $candidate.StartsWith($rootPrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
            }
            $cursor = $bundleRoot
            foreach ($part in ($relativePath -split '/')) {
              $cursor = Join-Path $cursor $part
              $item = Get-Item -LiteralPath $cursor -Force -ErrorAction Stop
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
              }
            }
            $file = Get-Item -LiteralPath $candidate -Force -ErrorAction Stop
            if (-not $file.PSIsContainer -and $file.FullName.StartsWith($rootPrefix, [StringComparison]::OrdinalIgnoreCase)) {
              return $candidate
            }
            throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID'
          }
          $manifestPath = Get-SafeBundleFile 'release-candidate.json'
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($null -ne $manifest.approval) { throw 'PUBLIC_BETA_APPROVAL_MUST_START_NULL' }
          $evidencePath = Get-SafeBundleFile ([string]$manifest.evidencePath)
          $artifactManifestPath = Get-SafeBundleFile ([string]$manifest.artifactManifestPath)
          $artifactManifestDigest = (Get-FileHash -LiteralPath $artifactManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (('sha256:' + $artifactManifestDigest) -cne [string]$manifest.artifactManifestDigest) {
            throw 'PUBLIC_BETA_ARTIFACT_MANIFEST_DIGEST_MISMATCH'
          }
          $remotePattern = '^(https|oci)://[A-Za-z0-9.-]+(?::[0-9]{1,5})?/[A-Za-z0-9][A-Za-z0-9._-]{0,254}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,254})*@sha256:([0-9a-f]{64})$'
          foreach ($artifact in @($manifest.artifacts)) {
            $remote = [regex]::Match([string]$artifact.imageOrPath, $remotePattern)
            if ($remote.Success) {
              if (('sha256:' + $remote.Groups[2].Value) -cne [string]$artifact.digest) { throw "PUBLIC_BETA_ARTIFACT_DIGEST_MISMATCH:$($artifact.name)" }
              continue
            }
            $path = Get-SafeBundleFile ([string]$artifact.imageOrPath)
            $actualDigest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if (('sha256:' + $actualDigest) -cne [string]$artifact.digest) { throw "PUBLIC_BETA_ARTIFACT_DIGEST_MISMATCH:$($artifact.name)" }
          }

      - name: Create canonical production approval attestation
        id: create-attestation
        env:
          APPROVER: ${{ steps.environment-review.outputs.reviewer }}
          APPROVAL_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.validate.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.validate.outputs.candidate_artifact_digest }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.validate.outputs.candidate_run_attempt }}
          APPROVAL_CONTROL_REF: ${{ github.ref }}
          APPROVAL_CONTROL_SHA: ${{ github.workflow_sha }}
          APPROVAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          APPROVAL_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = [IO.Path]::GetFullPath((Join-Path (Get-Location).Path $env:CANDIDATE_DIR))
          $manifestPath = Join-Path $bundleRoot 'release-candidate.json'
          $helperPath = Join-Path (Get-Location).Path 'openopc-create-approval.mjs'
          @'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { computePublicBetaManifestDigest } from './scripts/release/public-beta-release-manifest.ts';

          const [manifestPath, attestationPath, actor, candidateRunId, approvalRunId, expectedCommit, candidateArtifactId, candidateArtifactDigest, candidateRunAttempt, approvalControlRef, approvalControlSha, approvalWorkflowRef, approvalRunAttempt] = process.argv.slice(2);
          if (!/^[1-9][0-9]*$/.test(candidateArtifactId) || !/^sha256:[0-9a-f]{64}$/.test(candidateArtifactDigest) || !/^[1-9][0-9]*$/.test(candidateRunAttempt) || approvalControlRef !== 'refs/heads/main' || !/^[0-9a-f]{40}$/.test(approvalControlSha) || !approvalWorkflowRef.endsWith('@refs/heads/main') || Number(approvalRunAttempt) !== 1) {
            throw new Error('PUBLIC_BETA_CANDIDATE_IDENTITY_CHANGED');
          }
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          const preApprovalDigest = computePublicBetaManifestDigest(manifest);
          const approval = {
            environment: 'production',
            actor,
            approvedAt: new Date().toISOString(),
            manifestDigest: preApprovalDigest,
          };
          manifest.approval = approval;
          writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          const candidateArtifact = {
            id: candidateArtifactId,
            digest: candidateArtifactDigest,
            runAttempt: Number(candidateRunAttempt),
          };
          const approvalControl = {
            workflowRef: approvalWorkflowRef,
            ref: approvalControlRef,
            sha: approvalControlSha,
            runId: approvalRunId,
            runAttempt: Number(approvalRunAttempt),
          };
          writeFileSync(attestationPath, `${JSON.stringify({ schemaVersion: 1, candidateRunId, approvalRunId, expectedCommit, candidateArtifact, approvalControl, approval }, null, 2)}\n`);
          '@ | Set-Content -LiteralPath $helperPath -Encoding utf8NoBOM
          bun $helperPath $manifestPath (Join-Path (Get-Location).Path 'approval-attestation.json') $env:APPROVER $env:CANDIDATE_RUN_ID $env:APPROVAL_RUN_ID $env:EXPECTED_COMMIT $env:CANDIDATE_ARTIFACT_ID $env:CANDIDATE_ARTIFACT_DIGEST $env:CANDIDATE_RUN_ATTEMPT $env:APPROVAL_CONTROL_REF $env:APPROVAL_CONTROL_SHA $env:APPROVAL_WORKFLOW_REF $env:APPROVAL_RUN_ATTEMPT
          Remove-Item -LiteralPath $helperPath -Force

      - name: Revalidate the human-approved candidate
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          $bundleRoot = [IO.Path]::GetFullPath((Join-Path (Get-Location).Path $env:CANDIDATE_DIR))
          $env:OPENOPC_PUBLIC_BETA_BUNDLE_ROOT = $bundleRoot
          $manifestRelativePath = 'release-candidate.json'
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $bundleRoot $manifestRelativePath) | ConvertFrom-Json
          $evidenceRelativePath = [string]$manifest.evidencePath
          if ($evidenceRelativePath -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,254}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,254})*$') { throw 'PUBLIC_BETA_BUNDLE_PATH_INVALID' }
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $stderrPath = Join-Path $env:RUNNER_TEMP 'openopc-public-beta-approved.stderr'
          Remove-Item -LiteralPath $stderrPath -Force -ErrorAction SilentlyContinue
          $output = @(pnpm.cmd exec bun scripts/release/public-beta-release-manifest.ts --manifest $manifestRelativePath --evidence $evidenceRelativePath --now $now 2> $stderrPath)
          $validatorExit = $LASTEXITCODE
          if ($validatorExit -ne 0) { throw "PUBLIC_BETA_APPROVAL_VALIDATOR_EXIT:$validatorExit" }
          if ($output.Count -ne 1) { throw 'PUBLIC_BETA_VALIDATOR_STDOUT_INVALID' }
          $stderrLines = @(
            if (Test-Path -LiteralPath $stderrPath) {
              Get-Content -LiteralPath $stderrPath | Where-Object { $_.Length -gt 0 }
            }
          )
          if ($stderrLines.Count -ne 0) { throw 'PUBLIC_BETA_VALIDATOR_STDERR_INVALID' }
          $result = ([string]$output[0]) | ConvertFrom-Json
          if ($result.status -ne 'ready') { throw "PUBLIC_BETA_APPROVAL_REVALIDATION_FAILED:$($result.reasons -join ',')" }

      - name: Retain approval attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openopc-public-beta-approval-attestation
          path: approval-attestation.json
          if-no-files-found: error
