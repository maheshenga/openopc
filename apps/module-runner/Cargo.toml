[package]
name = "openopc-module-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8"] }
opentelemetry = "0.32.0"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde"] }
wasmtime = { version = "=47.0.2", default-features = false, features = ["anyhow", "async", "cache", "component-model", "cranelift", "pooling-allocator", "runtime", "std"] }
wasmtime-wasi = { version = "=47.0.2", default-features = false, features = ["p2"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5.3", features = ["util"] }
wat = "1.245.1"
wit-component = { version = "0.252.0", features = ["dummy-module"] }
wit-parser = "0.252.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
