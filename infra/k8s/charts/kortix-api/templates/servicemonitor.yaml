{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kortix-api.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kortix-api.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kortix-api.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if .Values.serviceMonitor.authorization.enabled }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.serviceMonitor.authorization.secretName | default .Values.externalSecrets.targetSecretName }}
          key: {{ .Values.serviceMonitor.authorization.secretKey }}
      {{- end }}
{{- end }}
