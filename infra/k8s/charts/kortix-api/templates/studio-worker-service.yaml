{{- if .Values.studioWorker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kortix-api.studioWorkerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kortix-api.studioWorkerLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.studioWorker.observabilityPort }}
      targetPort: observability
      protocol: TCP
  selector:
    {{- include "kortix-api.studioWorkerSelectorLabels" . | nindent 4 }}
{{- end }}
