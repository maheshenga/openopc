{{- if and .Values.studioWorker.enabled .Values.studioWorker.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kortix-api.studioWorkerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kortix-api.studioWorkerLabels" . | nindent 4 }}
    {{- with .Values.studioWorker.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kortix-api.studioWorkerSelectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.studioWorker.serviceMonitor.interval }}
{{- end }}
