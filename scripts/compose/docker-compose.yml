# Local compose helper. Build from repo root:
# docker compose -f scripts/compose/docker-compose.yml --profile backend up -d

services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_BILLING_ENABLED: ${NEXT_PUBLIC_BILLING_ENABLED:-false}
    ports:
      - "3000:3000"
    profiles: [frontend, all]
    restart: unless-stopped

  kortix-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        SERVICE: apps/api
    ports:
      - "8008:8008"
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      DEVELOPER_CODE_MODULES_ENABLED: ${DEVELOPER_CODE_MODULES_ENABLED:-false}
      DEVELOPER_TRUST_ENABLED: ${DEVELOPER_TRUST_ENABLED:-false}
      DEVELOPER_TRUST_READINESS_URL: ${DEVELOPER_TRUST_READINESS_URL:-http://developer-trust-worker:8080/readyz}
    networks:
      - default
      - developer-trust-sandbox-control
    profiles: [backend, all]
    restart: unless-stopped

  developer-trust-worker:
    build:
      context: ../..
      dockerfile: apps/developer-trust-worker/Dockerfile
    environment:
      DEVELOPER_TRUST_ENABLED: ${DEVELOPER_TRUST_ENABLED:-false}
      DEVELOPER_TRUST_PORT: "8080"
    profiles: [developer-trust]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch('http://127.0.0.1:8080/healthz')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - developer-trust-artifacts
      - developer-trust-db
      - developer-trust-sandbox-control
    restart: unless-stopped

  studio-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STUDIO_S3_ACCESS_KEY_ID:-openopcstudio}
      MINIO_ROOT_PASSWORD: ${STUDIO_S3_SECRET_ACCESS_KEY:-openopcstudio-local-only}
    ports:
      - "127.0.0.1:${STUDIO_MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    profiles: [studio, all]
    restart: unless-stopped

  studio-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set local http://studio-minio:9000
        "$${STUDIO_S3_ACCESS_KEY_ID}" "$${STUDIO_S3_SECRET_ACCESS_KEY}";
        mc mb --ignore-existing "local/$${STUDIO_OBJECT_STORE_BUCKET}";
        mc anonymous set none "local/$${STUDIO_OBJECT_STORE_BUCKET}";
        mc ilm rule add --expire-days 1 --prefix _studio-readiness/
        "local/$${STUDIO_OBJECT_STORE_BUCKET}"
    environment:
      STUDIO_OBJECT_STORE_BUCKET: ${STUDIO_OBJECT_STORE_BUCKET:-openopc-studio}
      STUDIO_S3_ACCESS_KEY_ID: ${STUDIO_S3_ACCESS_KEY_ID:-openopcstudio}
      STUDIO_S3_SECRET_ACCESS_KEY: ${STUDIO_S3_SECRET_ACCESS_KEY:-openopcstudio-local-only}
    depends_on:
      studio-minio:
        condition: service_healthy
    profiles: [studio, all]
    restart: "no"

  studio-worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        SERVICE: apps/api
    command: ["bun", "run", "/app/apps/studio-worker/src/index.ts"]
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      STUDIO_ENABLED: ${STUDIO_ENABLED:-false}
      STUDIO_FAKE_PROVIDER_ENABLED: ${STUDIO_FAKE_PROVIDER_ENABLED:-true}
      STUDIO_OPENAI_COMPATIBLE_ENABLED: ${STUDIO_OPENAI_COMPATIBLE_ENABLED:-false}
      STUDIO_OBJECT_STORE_MODE: s3
      STUDIO_OBJECT_STORE_BUCKET: ${STUDIO_OBJECT_STORE_BUCKET:-openopc-studio}
      STUDIO_OBJECT_STORE_PREFIX: ${STUDIO_OBJECT_STORE_PREFIX:-studio}
      STUDIO_S3_ENDPOINT: http://studio-minio:9000
      STUDIO_S3_REGION: ${STUDIO_S3_REGION:-us-east-1}
      STUDIO_S3_FORCE_PATH_STYLE: "true"
      STUDIO_S3_CREDENTIAL_MODE: static
      STUDIO_S3_ACCESS_KEY_ID: ${STUDIO_S3_ACCESS_KEY_ID:-openopcstudio}
      STUDIO_S3_SECRET_ACCESS_KEY: ${STUDIO_S3_SECRET_ACCESS_KEY:-openopcstudio-local-only}
      STUDIO_S3_SSE: AES256
      STUDIO_ALLOW_EPHEMERAL_STORAGE: "true"
      STUDIO_ALLOW_INSECURE_LOCAL_ENDPOINTS: "true"
      STUDIO_WORKER_ID: ${STUDIO_WORKER_ID:-openopc-local-worker}
    depends_on:
      studio-minio:
        condition: service_healthy
      studio-minio-init:
        condition: service_completed_successfully
    profiles: [studio, all]
    restart: on-failure

networks:
  developer-trust-artifacts:
    internal: true
  developer-trust-db:
    internal: true
  developer-trust-sandbox-control:
    internal: true
